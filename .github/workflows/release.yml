name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v5.0.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            gettext \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-3.0 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            libcairo2 \
            libegl1 \
            libgl1 \
            libgles2 \
            python3-gi \
            python3-pil \
            python3-venv \
            zsync

      - name: Create build environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
          msgfmt --check --check-format -o /dev/null po/vi.po

      - name: Build .deb
        run: packaging/build_deb.sh

      - name: Build AppImage
        run: PYTHON=.venv/bin/python packaging/appimage/build_appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: center-stage-linux
          path: |
            dist/center-stage_*.deb
            dist/CenterStage-*.AppImage
            dist/CenterStage-*.AppImage.zsync
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/windows/requirements.txt
          python -m pip install -r packaging/windows/build-requirements.txt
          python -m pip install --no-deps mediapipe==0.10.35

      - name: Compile translations
        run: python packaging/compile_translations.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Run Qt selftest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m center_stage.gui_qt --selftest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows app and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SkipDeps

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: center-stage-windows
          path: |
            packaging/windows/dist/CenterStage-Setup-*.exe
            packaging/windows/dist/CenterStage-*-win64.zip
            packaging/windows/dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [linux, windows]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Assemble stable release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p release-assets
          find downloaded/center-stage-linux -name 'center-stage_*.deb' -exec cp {} release-assets/ \;
          appimage=$(find downloaded/center-stage-linux -maxdepth 1 -name 'CenterStage-*.AppImage' -print -quit)
          cp "$appimage" release-assets/CenterStage-x86_64.AppImage
          if [ -f "$appimage.zsync" ]; then
            cp "$appimage.zsync" release-assets/CenterStage-x86_64.AppImage.zsync
          fi
          installer=$(find downloaded/center-stage-windows -name 'CenterStage-Setup-*.exe' -print -quit)
          portable=$(find downloaded/center-stage-windows -name 'CenterStage-*-win64.zip' -print -quit)
          cp "$installer" release-assets/CenterStage-Setup.exe
          cp "$portable" release-assets/CenterStage-win64.zip
          (
            cd release-assets
            sha256sum CenterStage-x86_64.AppImage center-stage_*.deb > SHA256SUMS-linux.txt
            sha256sum CenterStage-Setup.exe CenterStage-win64.zip > SHA256SUMS-windows.txt
            cat SHA256SUMS-linux.txt SHA256SUMS-windows.txt > SHA256SUMS.txt
          )
          ls -lh release-assets

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          cat > release-notes.md <<EOF
          ## Center Stage ${version}

          Center Stage turns a webcam into a face-tracking virtual camera with
          automatic framing, portrait blur, studio lighting, photo capture, and
          video recording.

          ### Downloads

          - **Linux (.deb)** — \`center-stage_${version}_amd64.deb\`
          - **Linux (slim AppImage)** — \`CenterStage-x86_64.AppImage\` (requires Python 3.12, GTK 3, GStreamer, and PipeWire)
          - **Windows installer (Beta)** — \`CenterStage-Setup.exe\`
          - **Windows portable (Beta)** — \`CenterStage-win64.zip\`

          The Windows build is marked **Beta** until it has completed hardware
          validation and OBS Virtual Camera testing on a physical Windows machine.

          ### Verification

          Download \`SHA256SUMS.txt\` and verify the asset before running it:

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          The in-app update checker uses the same checksums and the stable
          download names above.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" \
              --title "Center Stage ${version}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" release-assets/* \
              --title "Center Stage ${version}" \
              --notes-file release-notes.md \
              --latest
          fi
