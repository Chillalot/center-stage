name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-3.0 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            libcairo2 \
            libegl1 \
            libgl1 \
            libgles2 \
            python3-gi \
            python3-pil \
            shellcheck \
            v4l-utils

      - name: Create test environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install --no-deps mediapipe==0.10.35

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Validate Vietnamese catalog
        run: msgfmt --check --check-format -o /dev/null po/vi.po

      - name: Lint shell scripts
        run: |
          shellcheck packaging/*.sh packaging/preinst packaging/postinst packaging/prerm packaging/postrm tests/*.sh packaging/appimage/AppRun packaging/appimage/build_appimage.sh

  appimage:
    name: Slim AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gettext             gir1.2-ayatanaappindicator3-0.1             gir1.2-gst-plugins-base-1.0             gir1.2-gstreamer-1.0             gir1.2-gtk-3.0             gstreamer1.0-plugins-base             gstreamer1.0-plugins-good             gstreamer1.0-tools             libcairo2             libegl1             libgl1             libgles2             python3-gi             python3-pil             python3-venv             zsync

      - name: Build AppImage
        run: |
          python3 -m venv .venv-appimage
          .venv-appimage/bin/python -m pip install --upgrade pip
          PYTHON=.venv-appimage/bin/python packaging/appimage/build_appimage.sh

      - name: Test AppImage payload
        run: |
          cd dist
          appimage=$(find . -maxdepth 1 -name 'CenterStage-*.AppImage' ! -name '*.zsync' -print -quit)
          "$appimage" --appimage-extract >/dev/null
          APPDIR="$PWD/squashfs-root"           PYTHONPATH="$PWD/squashfs-root/usr/lib/center-stage/app:$PWD/squashfs-root/usr/lib/center-stage/vendor"           CENTER_STAGE_SHARE_DIR="$PWD/squashfs-root/usr/lib/center-stage"           CENTER_STAGE_LOCALE_DIR="$PWD/squashfs-root/usr/lib/center-stage/locale"           python3 - <<'PY'
          import center_stage
          import center_stage.engine as engine
          import center_stage.gui
          from center_stage.i18n import translator

          assert center_stage.__version__ == "5.0.0"
          assert engine.GST_AVAILABLE is True
          assert translator("vi")("Settings") == "Cài đặt"
          assert engine.model_path().exists()
          assert engine.segmentation_model_path().exists()
          print("AppImage payload OK")
          PY

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: center-stage-appimage
          path: |
            dist/CenterStage-*.AppImage
            dist/CenterStage-*.AppImage.zsync
            dist/CenterStage-*.AppImage.sha256
          if-no-files-found: error

  windows:
    name: Windows tests and build
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/windows/requirements.txt
          python -m pip install -r packaging/windows/build-requirements.txt
          python -m pip install --no-deps mediapipe==0.10.35

      - name: Compile translations
        run: python packaging/compile_translations.py

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Run Qt selftest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m center_stage.gui_qt --selftest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows app and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SkipDeps

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: center-stage-windows
          path: |
            packaging/windows/dist/CenterStage-Setup-*.exe
            packaging/windows/dist/CenterStage-*-win64.zip
            packaging/windows/dist/SHA256SUMS-windows.txt
          if-no-files-found: error
