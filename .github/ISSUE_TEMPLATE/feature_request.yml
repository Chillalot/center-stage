name: Feature request
description: Propose a focused improvement for Center Stage
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first, then the proposed change. Large changes
        to the engine/output contract should be discussed before implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep the scope focused. Mention alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Linux
        - Windows
        - Both
        - Packaging/release tooling
        - Documentation

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, related issues, or constraints.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to help test or implement this change.
          required: false
